name: Template Sync Verification
on:
  pull_request:
    paths:
      - "packages/cli/templates/typescript/**"
      - "tests/*/**"

jobs:
  verify-template-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v41
        with:
          files: |
            packages/cli/templates/typescript/**
            tests/**

      - name: Check PR description
        id: pr
        run: |
          if [[ "${{ github.event.pull_request.body }}" == *"skip-test-verification"* ]]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Verify template sync
        if: steps.pr.outputs.skip != 'true'
        run: |
          status=0
          template_changes=()
          test_changes=()

          # Group files by directory
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            if [[ $file == packages/cli/templates/typescript/* ]]; then
              dir=$(echo "$file" | sed -n 's|packages/cli/templates/typescript/\([^/]*\)/.*|\1|p')
              if [ ! -z "$dir" ]; then
                template_changes+=("$dir")
              fi
            elif [[ $file == tests/* ]]; then
              dir=$(echo "$file" | sed -n 's|tests/\([^/]*\)/.*|\1|p')
              if [ ! -z "$dir" ]; then
                test_changes+=("$dir")
              fi
            fi
          done

          # Check for missing corresponding changes
          for dir in "${template_changes[@]}"; do
            if [[ ! " ${test_changes[@]} " =~ " ${dir} " ]]; then
              echo "::error::Template files changed but no corresponding test changes found:"
              echo "Changed files in: packages/cli/templates/typescript/$dir"
              echo "Expected changes in: tests/$dir"
              status=1
            fi
          done

          for dir in "${test_changes[@]}"; do
            if [[ ! " ${template_changes[@]} " =~ " ${dir} " ]]; then
              echo "::error::Test files changed but no corresponding template changes found:"
              echo "Changed files in: tests/$dir"
              echo "Expected changes in: packages/cli/templates/typescript/$dir"
              status=1
            fi
          done

          exit $status
