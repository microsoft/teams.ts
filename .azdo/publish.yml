# =============================================================================
# This pipeline publishes npm packages. Manually triggered only.
# - Internal: publishes unsigned packages to the internal TeamsSDKPreviews feed.
# - Public: publishes signed packages to npm via ESRP (requires approval).
# - promoteView: Internal only. Feed view to promote the published packages to.
#   None skips promotion. Promotion is one-way:
#   Azure Artifacts has no demotion, so a view can only be cleaned up by
#   deleting the package version or the view itself.
# =============================================================================

trigger: none

pr: none

parameters:
- name: publishType
  displayName: 'Publish Type'
  type: string
  default: 'Internal'
  values:
  - Internal
  - Public

- name: promoteView
  displayName: 'Promote to feed view (Internal only, None to skip)'
  type: string
  default: 'None'
  values:
  - 'None'
  - 'Prerelease'
  - 'Release'

variables:
- group: TeamsSDK-Release
- name: internalFeedName
  value: 'TeamsSDKPreviews'

resources:
  repositories:
  - repository: 1esPipelines
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1esPipelines
  parameters:
    pool:
      name: 1ES-Teams-Windows-2022-DomoreexpGithub
      os: windows
    stages:
    - stage: build
      displayName: Build and Test
      jobs:
      - job: build_test
        pool:
          name: 1ES-Teams-Windows-2022-DomoreexpGithub
          os: windows
        templateContext:
          outputs:
          - output: pipelineArtifact
            targetPath: $(Build.SourcesDirectory)/out
            artifactName: npm-packages
        variables:
          ob_outputDirectory: '$(Build.SourcesDirectory)/out'
          ob_git_fetchTags: true
          ob_sdl_binskim_break: true
          ob_git_fetchDepth: -1

        steps:
        - checkout: self
          displayName: 'Checkout'
          fetchDepth: 0
          target:
            container: host

        - task: NodeTool@0
          displayName: 'Use Node 24.x'
          inputs:
            versionSpec: '24.x'
            checkLatest: true
          target:
            container: host

        - task: UseDotNet@2
          displayName: 'Use .NET SDK'
          inputs:
            packageType: 'sdk'
            version: '8.x'
          target:
            container: host
        - task: NuGetAuthenticate@1
          displayName: 'Authenticate to Azure Artifacts'
          target:
            container: host

        - powershell: |
            $nugetConfig = "$(Agent.TempDirectory)\NuGet.TeamsSDKPreviews.config"

            @'
            <?xml version="1.0" encoding="utf-8"?>
            <configuration>
              <packageSources>
                <clear />
                <add key="TeamsSDKPreviews" value="https://pkgs.dev.azure.com/DomoreexpGithub/Github_Pipelines/_packaging/TeamsSDKPreviews/nuget/v3/index.json" />
              </packageSources>
            </configuration>
            '@ | Set-Content -Path $nugetConfig -Encoding UTF8

            dotnet nuget list source --configfile $nugetConfig

            dotnet tool install -g nbgv --configfile $nugetConfig

            $toolsPath = Join-Path $env:USERPROFILE ".dotnet\tools"
            $env:PATH = "$toolsPath;$env:PATH"
            Write-Host "##vso[task.prependpath]$env:USERPROFILE\.dotnet\tools"

            nbgv --version
            nbgv cloud
          displayName: 'Install nbgv and set cloud build version'
          target:
            container: host

        # Always use internal feed for dependency resolution (avoids firewall issues on 1ES pool)
        - task: CmdLine@2
          displayName: 'Configure npm registry'
          inputs:
            script: |
              echo always-auth=true >> .npmrc
              echo registry=https://pkgs.dev.azure.com/DomoreexpGithub/Github_Pipelines/_packaging/TeamsSDKPreviews/npm/registry/ >> .npmrc
          target:
            container: host

        - task: NpmAuthenticate@0
          displayName: 'Authenticate npm registry'
          inputs:
            workingFile: .npmrc
          target:
            container: host

        - task: Npm@1
          displayName: 'npm ci'
          inputs:
            command: ci
            verbose: true
          target:
            container: host

        - script: npm run build
          displayName: 'npm build'
          target:
            container: host

        - script: npm test
          displayName: 'npm test'
          continueOnError: false
          target:
            container: host

        - powershell: |
            Write-Host "Stamping package versions from nbgv..."
            npm run version:stamp

            # Get version from nbgv and set NpmTag
            $version = (npm run version:get --silent).Trim()
            Write-Host "Version from nbgv: $version"
            Write-Host "##vso[task.setvariable variable=VersionNumber;isOutput=true]$version"

            # If version contains '-' it's a prerelease, use 'next' tag; otherwise 'latest'
            if ($version -match '-') {
              Write-Host "Prerelease version detected - using 'next' npm tag"
              Write-Host "##vso[task.setvariable variable=NpmTag;isOutput=true]next"
            } else {
              Write-Host "Stable version detected - using 'latest' npm tag"
              Write-Host "##vso[task.setvariable variable=NpmTag;isOutput=true]latest"
            }
          displayName: 'Stamp package versions (nbgv)'
          name: versionStep
          env:
            PublicRelease: 'true'
          target:
            container: host

        - powershell: |
            New-Item -ItemType Directory -Force -Path ./out

            Get-ChildItem -Path packages, external -Directory | ForEach-Object {
              $packageJsonPath = "$($_.FullName)/package.json"
              if (Test-Path $packageJsonPath) {
                $packageJson = Get-Content $packageJsonPath | ConvertFrom-Json
                if ($packageJson.private -eq $true) {
                  Write-Host "Skipping $($_.Name) (marked as private)"
                } elseif ($packageJson.deprecated) {
                  Write-Host "Skipping $($_.Name) (marked as deprecated)"
                } else {
                  Write-Host "Packing $($_.Name)..."
                  Set-Location $_.FullName
                  npm pack --pack-destination ../../out
                  Set-Location ../..
                }
              }
            }

            Write-Host "`nFiles to publish:"
            Get-ChildItem ./out
          displayName: 'npm pack (excluding private packages)'
          target:
            container: host

    - stage: publish
      displayName: Publish
      dependsOn: build
      variables:
        VersionNumber: $[stageDependencies.build.build_test.outputs['versionStep.VersionNumber']]
        NpmTag: $[stageDependencies.build.build_test.outputs['versionStep.NpmTag']]
      jobs:
      # Publish to internal npm feed (Azure Artifacts)
      - job: publish_internal
        condition: and(succeeded(), eq('${{ parameters.publishType }}', 'Internal'))
        pool:
          name: 1ES-Teams-Windows-2022-DomoreexpGithub
          os: windows
        templateContext:
          inputs:
          - input: pipelineArtifact
            artifactName: npm-packages
            targetPath: $(Pipeline.Workspace)/npm-packages
        steps:
        - task: NodeTool@0
          displayName: 'Use Node 24.x'
          inputs:
            versionSpec: '24.x'
            checkLatest: true
          target:
            container: host

        # Configure npm to use internal feed for publishing
        - task: CmdLine@2
          displayName: 'Configure npm registry'
          inputs:
            script: |
              echo always-auth=true >> .npmrc
              echo registry=https://pkgs.dev.azure.com/DomoreexpGithub/Github_Pipelines/_packaging/TeamsSDKPreviews/npm/registry/ >> .npmrc
          target:
            container: host

        - task: NpmAuthenticate@0
          displayName: 'Authenticate npm registry'
          inputs:
            workingFile: .npmrc
          target:
            container: host

        - powershell: |
            Get-ChildItem $(Pipeline.Workspace)/npm-packages -Filter *.tgz | ForEach-Object {
              Write-Host "Publishing $($_.Name) to internal feed..."
              npm publish $_.FullName --tag $(NpmTag)
            }
          displayName: 'Publish packages to internal npm feed'
          target:
            container: host

        # Promotion is one-way. Azure Artifacts has no demotion, so a version can
        # only leave a view by deleting the version or the view itself. Views are
        # for browsing and downstream consumption only; dependency resolution must
        # keep pointing at the feed itself, which is where cached upstream
        # packages live.
        - ${{ if ne(parameters.promoteView, 'None') }}:
          - pwsh: |
              $ErrorActionPreference = 'Stop'

              # The parameter's values list constrains this to a known view, and it
              # arrives through the environment rather than being interpolated into
              # this script, so a value cannot close the string and run as code in a
              # job that holds SYSTEM_ACCESSTOKEN.
              $view = $env:PROMOTE_VIEW
              if ($view -notmatch '^[A-Za-z0-9._-]+$') { throw 'promoteView must be a feed view name matching ^[A-Za-z0-9._-]+$.' }
              $org = "$(System.CollectionUri)".TrimEnd('/').Split('/')[-1]
              $project = '$(System.TeamProject)'
              $feed = '$(internalFeedName)'
              $headers = @{ Authorization = "Bearer $env:SYSTEM_ACCESSTOKEN" }

              $tarballs = @(Get-ChildItem -Path '$(Pipeline.Workspace)/npm-packages' -Filter '*.tgz')
              if ($tarballs.Count -eq 0) { throw 'No .tgz files found to promote.' }

              $promoted = 0
              $failed = @()
              foreach ($file in $tarballs) {
                # npm mangles the scope into the file name (@microsoft/teams.apps
                # packs as microsoft-teams.apps-2.0.14.tgz), so the file name does
                # not round-trip back to a package name. Read the manifest instead.
                $extractDir = Join-Path '$(Agent.TempDirectory)' ([System.Guid]::NewGuid().ToString())
                New-Item -ItemType Directory -Path $extractDir -Force | Out-Null
                try {
                  tar -xf $file.FullName -C $extractDir 'package/package.json'
                  if ($LASTEXITCODE -ne 0) { throw "Failed to extract package.json from $($file.Name)." }
                  $manifest = Get-Content (Join-Path $extractDir 'package/package.json') -Raw -Encoding UTF8 | ConvertFrom-Json
                } finally {
                  Remove-Item $extractDir -Recurse -Force -ErrorAction SilentlyContinue
                }

                $name = $manifest.name
                $version = $manifest.version

                # The feed is shared with other products, so only promote the
                # packages this SDK owns. @microsoft/teams-js in particular is a
                # different product that also lives in this feed.
                if (-not $name.StartsWith('@microsoft/teams.', [StringComparison]::OrdinalIgnoreCase)) {
                  Write-Host "Skipping $name (not owned by this SDK)"
                  continue
                }

                # The scope is percent-encoded, the separating slash is not.
                $encodedName = $name -replace '^@', '%40'
                $uri = "https://pkgs.dev.azure.com/$org/$project/_apis/packaging/feeds/$feed/npm/$encodedName/versions/$version" + '?api-version=7.2-preview.1'
                $body = @{ views = @{ op = 'add'; path = '/views/-'; value = $view } } | ConvertTo-Json -Compress

                Write-Host "Promoting $name $version to @$view"
                try {
                  Invoke-RestMethod -Method Patch -Uri $uri -Headers $headers -ContentType 'application/json' -Body $body | Out-Null
                  $promoted++
                } catch {
                  $reason = $_.Exception.Message
                  Write-Host "##vso[task.logissue type=error]Failed to promote $name $version : $reason"
                  $failed += "$name $version"
                }
              }

              if ($failed.Count -gt 0) {
                $failedList = $failed -join ', '
                throw "Promotion failed for: $failedList"
              }
              if ($promoted -eq 0) { throw 'No @microsoft/teams.* packages found to promote.' }

              Write-Host "Promoted $promoted package(s) to @$view"
            displayName: 'Promote packages to @${{ parameters.promoteView }}'
            env:
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)
              PROMOTE_VIEW: ${{ parameters.promoteView }}
            target:
              container: host

      # Publish to npm via ESRP
      - job: publish_public
        condition: and(succeeded(), eq('${{ parameters.publishType }}', 'Public'))
        pool:
          name: 1ES-Teams-Windows-2022-DomoreexpGithub
          os: windows
        templateContext:
          type: releaseJob
          isProduction: true
          inputs:
          - input: pipelineArtifact
            artifactName: npm-packages
            targetPath: $(Pipeline.Workspace)/npm-packages
        steps:
        - task: EsrpRelease@10
          displayName: 'Publish packages to npm via ESRP'
          inputs:
            connectedservicename: 'TeamsESRP-Release-Npm'
            usemanagedidentity: true
            keyvaultname: 'esrp-teams'
            signcertname: '37a342c7-607b-474f-a41f-b772450e461d'
            clientid: '37a342c7-607b-474f-a41f-b772450e461d'
            intent: 'packagedistribution'
            contenttype: 'npm'
            contentsource: 'Folder'
            folderlocation: '$(Pipeline.Workspace)/npm-packages'
            waitforreleasecompletion: true
            serviceendpointurl: 'https://api.esrp.microsoft.com'
            owners: $(Release.Owners)
            approvers: $(Release.Approvers)
            mainpublisher: 'ESRPRELPACMAN'
            domaintenantid: '975f013f-7f24-47e8-a7d3-abc4752bf346'
            productState: $(NpmTag)
            releasetitle: 'Teams SDK TypeScript $(VersionNumber)'
          target:
            container: host
